# Railway resolves this file from the repository root; commands run in the
# existing /skillbridge-backend service root. Publishing is owner-controlled.
[build]
builder = "RAILPACK"
buildCommand = "python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0 && python -m pip install -r requirements-production.txt && python scripts/prepare_nlp.py --download && python manage.py collectstatic --noinput"

[deploy]
preDeployCommand = ["python manage.py migrate --noinput"]
preDeployTimeoutSeconds = 300
# Override only on the service used for the hosted comparison test.
startCommand = "gunicorn core.wsgi:application --worker-class gevent --workers 2 --worker-connections 1000 --timeout ${GUNICORN_WORKER_TIMEOUT_SECONDS:-120} --bind 0.0.0.0:$PORT"
healthcheckPath = "/api/health/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
